# Pre-commit hooks. Install once with `pre-commit install`; run everything with
# `pre-commit run --all-files`. Tool versions come from mise.toml.
minimum_pre_commit_version: "4.7.0"

repos:
  # Generic file hygiene with tools pinned by mise, so that no hook installs
  # anything when it runs (ADR 0020). They check and report; none of them
  # rewrites files.
  - repo: local
    hooks:
      # Trailing whitespace, final newline, line endings and charset, as
      # declared in .editorconfig. .editorconfig-checker.json turns off its
      # built-in exclusions (pnpm-lock.yaml, go.sum, *.svg...), since
      # pre-commit already passes text files only, and the indentation size
      # check.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      # yq parses every document in a file, so the two YAML documents of
      # pnpm-lock.yaml need no extra flag. It accepts duplicate keys.
      - id: check-yaml
        name: check yaml
        entry: yq --input-format yaml --output-format yaml "true"
        language: system
        types: [yaml]
      # jv parses YAML with gopkg.in/yaml.v3, which rejects a duplicate key at
      # any depth. It reads only the first document of a file: the second
      # document of pnpm-lock.yaml, written by pnpm, is not checked (ADR 0021,
      # issue #17). It also fails on an empty file and on non-string keys,
      # which are valid YAML: give an empty placeholder a "---" line.
      - id: check-yaml-duplicates
        name: check yaml duplicate keys
        entry: jv scripts/hooks/any-document.schema.json
        language: system
        types: [yaml]
      # Standard library only, run isolated (-I) so that no module from the
      # repository can shadow the json module. Also rejects duplicate keys.
      - id: check-json
        name: check json
        entry: python3 -I scripts/hooks/check-json.py
        language: system
        types: [json]
      - id: check-toml
        name: check toml
        entry: scripts/hooks/check-toml.sh
        language: system
        types: [toml]
      # The patterns of check-merge-conflict in pre-commit-hooks 6.0.0. pygrep
      # ships with pre-commit and installs nothing. It always checks, as the
      # upstream hook did with --assume-in-merge.
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: '^(<<<<<<< |======= |=======\r?$|>>>>>>> )'
        language: pygrep
        types: [text]
      # Every file pre-commit passes, as check-added-large-files did with
      # --enforce-all: a tracked file that grows is also caught.
      - id: check-large-files
        name: check for large files
        entry: scripts/hooks/check-large-files.sh
        language: system
        stages: [pre-commit, pre-push, manual]
      # The headers of detect-private-key in pre-commit-hooks 6.0.0, plus
      # PuTTY key format 3 (written by PuTTY 0.75 and later; upstream only
      # matches format 2). They are written as alternatives and character
      # classes so that this file does not match itself. gitleaks also looks
      # for private keys, but only complete ones; this hook flags a header on
      # its own.
      - id: detect-private-key
        name: detect private key
        entry: 'BEGIN (RSA |DSA |EC |OPENSSH |ENCRYPTED |SSH2 ENCRYPTED |PGP |)PRIVATE KEY|PuTTY-User-Key-File-[23]|BEGIN OpenVPN Static key V[1]'
        language: pygrep
        types: [text]
      # The hook scripts run on every commit and the capture scripts run on
      # the maintainer's machine and hosts, so they are linted too.
      - id: shellcheck
        name: shellcheck (hook and capture scripts)
        entry: shellcheck
        language: system
        types: [shell]
        files: ^(scripts|protocol/captures)/

  # Security tools installed by mise (single source of versions).
  - repo: local
    hooks:
      # What is about to be committed. The official gitleaks hook does only this,
      # so on `pre-commit run --all-files` (nothing staged) it checks nothing.
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      # The whole git history, so `--all-files` (verify skill, CI) checks something real.
      - id: gitleaks-history
        name: gitleaks (git history)
        entry: gitleaks git --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      # actionlint lints `run:` scripts with the shellcheck pinned in mise.toml.
      # pyflakes is disabled: there is no Python in the workflows, and an
      # unpinned copy found on PATH would make results differ between machines.
      - id: actionlint
        name: actionlint
        entry: actionlint -pyflakes=
        language: system
        types: [yaml]
        files: ^\.github/workflows/
      # Offline locally (no token); CI runs it online as well.
      - id: zizmor
        name: zizmor (offline)
        entry: zizmor --offline --no-progress .
        language: system
        pass_filenames: false
        files: ^(\.github/|\.pre-commit-config\.yaml$)
