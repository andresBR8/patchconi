# Pinned developer toolchain. One source of versions for laptops, CI and Renovate.
# Install with: mise trust && mise install --locked
# Every version is exact and was at least 3 days old when pinned.

[tools]
node = "24.22.0"
go = "1.27.2"
"aqua:pnpm/pnpm" = "12.13.0"
"aqua:rhysd/actionlint" = "1.7.12"
# Used by actionlint to lint `run:` scripts. Pinned so local and CI results match
# (GitHub-hosted runners ship their own unpinned shellcheck).
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:pre-commit/pre-commit" = "4.7.0"
# Built from source instead of the release binaries: the v8.30.1 tag was moved
# after release to a commit that only changes .goreleaser.yml, and the binaries
# carry no signature or provenance. The go backend builds the code recorded by
# proxy.golang.org and verified by sum.golang.org. The build tag and ldflags
# match the official release build. GOTOOLCHAIN=local stops go from downloading
# another compiler on its own: it builds with the go pinned above or fails.
# The GOPROXY/GOSUMDB family is pinned here so that no global environment
# (GOSUMDB=off, GOPROXY=direct, GONOSUMDB, ...) can silently skip the proxy or
# the checksum database: mise.lock records no checksum for go: tools.
"go:github.com/zricethezav/gitleaks/v8" = { version = "8.30.1", tags = ["gore2regex"], install_env = { CGO_ENABLED = "0", GOTOOLCHAIN = "local", GOFLAGS = "-ldflags=-X=github.com/zricethezav/gitleaks/v8/version.Version=8.30.1", GOPROXY = "https://proxy.golang.org", GOSUMDB = "sum.golang.org", GONOPROXY = "", GONOSUMDB = "", GOPRIVATE = "", GOINSECURE = "" } }

# File hygiene for pre-commit. yq's release signs its checksums with cosign,
# which the aqua backend verifies. editorconfig-checker and tomljson publish no
# signature or build provenance, so they are built from source like gitleaks,
# with the same proxy and checksum database settings (ADR 0020).
"aqua:mikefarah/yq" = "4.54.1"
"go:github.com/editorconfig-checker/editorconfig-checker/v4/cmd/editorconfig-checker" = { version = "4.0.2", install_env = { CGO_ENABLED = "0", GOTOOLCHAIN = "local", GOPROXY = "https://proxy.golang.org", GOSUMDB = "sum.golang.org", GONOPROXY = "", GONOSUMDB = "", GOPRIVATE = "", GOINSECURE = "" } }
"go:github.com/pelletier/go-toml/v2/cmd/tomljson" = { version = "2.4.3", install_env = { CGO_ENABLED = "0", GOTOOLCHAIN = "local", GOPROXY = "https://proxy.golang.org", GOSUMDB = "sum.golang.org", GONOPROXY = "", GONOSUMDB = "", GOPRIVATE = "", GOINSECURE = "" } }
# JSON Schema validator for the protocol examples and YAML duplicate keys
# (ADR 0021). Its release binaries come with md5 sums only, so it is built
# from source like the tools above.
"go:github.com/santhosh-tekuri/jsonschema/cmd/jv" = { version = "0.7.0", install_env = { CGO_ENABLED = "0", GOTOOLCHAIN = "local", GOPROXY = "https://proxy.golang.org", GOSUMDB = "sum.golang.org", GONOPROXY = "", GONOSUMDB = "", GOPRIVATE = "", GOINSECURE = "" } }

[env]
# pip only installs packages uploaded at least 3 days ago, including pip's
# isolated builds. No pre-commit hook installs Python packages today; the
# cutoff stays as a safety net, so that adding such a hook cannot skip it.
PIP_UPLOADED_PRIOR_TO = "P3D"

[settings]
# Keep mise.lock (versions, URLs and checksums) up to date on every install.
lockfile = true
# Platforms recorded in mise.lock, so `mise install --locked` works on Linux and macOS.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
